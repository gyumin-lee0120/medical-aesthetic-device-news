name: Medical Aesthetic Device News 수집

on:
  schedule:
    # KST 월~금 오전 7:30 = UTC 일~목 22:30
    - cron: "30 22 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 네이버 뉴스 수집
        working-directory: collectors
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python naver_news.py

      - name: 뉴스 데이터 커밋 및 푸시
        run: |
          git config user.name "news-clipping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json docs/data/news.json
          git diff --quiet --cached || git commit -m "chore: device news update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Telegram Daily Brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py
