<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WONTECH Medical Aesthetic Device News</title>
<style>
:root{--bg:#fff;--surface:#f5f5f3;--text:#171717;--sub:#666;--muted:#999;--border:#e5e5e0;--accent:#fb510d;--accent-soft:#fff0e9}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--surface:#242420;--text:#f3f3ef;--sub:#aaa;--muted:#777;--border:#35352f;--accent-soft:#4a2415}}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 64px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55}.wrap{max-width:1040px;margin:auto}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}.muted{color:var(--sub);font-size:12px;margin:4px 0 0}.btn{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 11px;cursor:pointer}.tabs,.chips,.quick{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin:18px 0 10px}.tab,.chip,.quick span{padding:6px 11px;border-radius:999px;background:var(--surface);color:var(--sub);cursor:pointer;font-size:12px}.tab.active,.chip.active,.quick span.active{background:var(--accent-soft);color:var(--accent);font-weight:600}.period{display:flex;gap:3px;background:var(--surface);padding:3px;border-radius:8px}.period span{padding:4px 9px;border-radius:6px;color:var(--sub);font-size:12px;cursor:pointer}.period span.active{background:var(--bg);color:var(--text)}.brief{background:var(--surface);padding:16px 18px;border-radius:12px;margin:14px 0}.brief b{font-size:13px}.brief p{margin:6px 0 0;color:var(--sub);font-size:13px}.section{margin-top:22px}.section h2{font-size:14px;margin:0 0 10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric,.panel,.cal-card,.list-card{background:var(--surface);border-radius:12px;padding:14px}.metric small{color:var(--sub)}.metric strong{display:block;font-size:22px;margin-top:5px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.panel-title{font-size:12px;color:var(--sub);margin-bottom:10px}.bar-row{display:grid;grid-template-columns:88px 1fr 42px;gap:8px;align-items:center;margin:7px 0;font-size:12px}.bar{height:7px;background:var(--border);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.news-list{border-top:1px solid var(--border);margin-top:10px}.news{display:block;text-decoration:none;color:inherit;padding:11px 0;border-bottom:1px solid var(--border)}.news-title{font-size:14px;margin:0 0 4px}.meta{font-size:11px;color:var(--sub)}.badge{display:inline-block;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;margin-right:5px}.empty{color:var(--muted);text-align:center;padding:24px 0}.calgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal-days span{padding:4px 0;font-size:11px}.dow{color:var(--muted)}.evt{cursor:pointer;font-weight:700;color:var(--accent)}.detail{font-size:12px;color:var(--sub);margin-top:8px;min-height:20px}.detail a{color:var(--accent)}.event-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)}.event-row a{color:inherit;text-decoration:none}.event-row a:hover{color:var(--accent)}
@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.grid3,.calgrid{grid-template-columns:1fr}.bar-row{grid-template-columns:78px 1fr 36px}}
</style>
</head>
<body><div class="wrap">
<div class="row"><div><h1>WONTECH Medical Aesthetic Device News</h1><p class="muted" id="lastUpdated">불러오는 중...</p></div><button class="btn" onclick="location.reload()">새로고침</button></div>
<div class="row"><div class="tabs"><span class="tab active" data-view="all">전체 시장</span><span class="tab" data-view="wontech">WONTECH</span><span class="tab" data-view="competitor">주요 경쟁사</span></div><div class="period"><span class="active" data-period="1">오늘</span><span data-period="7">7일</span><span data-period="30">30일</span></div></div>
<div class="brief"><b>이번 기간 브리핑</b><p id="briefText">데이터를 불러오는 중입니다...</p></div>
<div class="section"><h2>경쟁제품 바로보기</h2><div class="quick" id="productQuick"></div></div>
<div class="section"><h2>기술·이슈 필터</h2><div class="chips" id="categoryChips"></div></div>
<div class="metrics"><div class="metric"><small>수집 뉴스</small><strong id="mTotal">-</strong></div><div class="metric"><small>WONTECH 언급</small><strong id="mOwn">-</strong></div><div class="metric"><small>경쟁사 언급</small><strong id="mComp">-</strong></div><div class="metric"><small>최다 기술·이슈</small><strong id="mTop">-</strong></div></div>
<div class="section"><h2>시장 지표</h2><div class="grid3"><div class="panel"><div class="panel-title">뉴스 모멘텀 · 최근 7일 vs 이전 7일</div><div id="momentum"></div></div><div class="panel"><div class="panel-title">경쟁사/경쟁제품 언급 TOP</div><div id="competitorBars"></div></div><div class="panel"><div class="panel-title">기술군·이슈 구성</div><div id="categoryBars"></div></div></div></div>
<div class="section"><h2>뉴스</h2><div class="news-list" id="newsList"><div class="empty">불러오는 중...</div></div></div>
<div class="section"><h2>학회·전시회 캘린더</h2><div class="calgrid"><div class="cal-card"><div class="cal-nav"><button class="btn" id="prev">‹</button><b id="calTitle"></b><button class="btn" id="next">›</button></div><div class="cal-days" id="calendar"></div><div class="detail" id="calDetail">날짜를 클릭하면 행사 링크를 확인할 수 있습니다.</div></div><div class="list-card"><div class="panel-title">다가오는 주요 행사</div><div id="eventList"></div></div></div></div>
</div>
<script>
const DATA_URL='data/news.json', EXH_URL='data/exhibitions.json';
const trackedProducts=['세르프','덴서티','볼뉴머','써마지','울쎄라','슈링크','Morpheus8','피코슈어','피코웨이','Clarity II'];
let allNews=[], events=[], state={view:'all',days:1,category:'전체',product:'전체'};
const arr=v=>Array.isArray(v)?v:[];
function when(s){const d=new Date(s);return isNaN(d)?null:d}
function inDays(i,d){const x=when(i.pub_date);return !x||x>=new Date(Date.now()-d*86400000)}
function own(i){return arr(i.own_company_mentions).length+arr(i.own_product_mentions).length+arr(i.own_brand_mentions).length>0}
function comp(i){return arr(i.competitor_company_mentions).length+arr(i.competitor_product_mentions).length+arr(i.competitor_mentions).length>0}
function productText(i){return [...arr(i.competitor_product_mentions),...arr(i.competitor_mentions)].join(' ').toLowerCase()}
function filtered(){return allNews.filter(i=>inDays(i,state.days)&&(state.view==='all'||(state.view==='wontech'&&own(i))||(state.view==='competitor'&&comp(i)))&&(state.category==='전체'||arr(i.categories).includes(state.category))&&(state.product==='전체'||productText(i).includes(state.product.toLowerCase())))}
function counts(items,keyfn){const o={};items.forEach(i=>keyfn(i).forEach(k=>o[k]=(o[k]||0)+1));return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function bars(el,rows){const max=rows[0]?.[1]||1;el.innerHTML=rows.length?rows.slice(0,5).map(([k,v])=>`<div class="bar-row"><span>${k}</span><div class="bar"><i style="width:${Math.max(6,v/max*100)}%"></i></div><b>${v}</b></div>`).join(''):'<div class="empty">데이터 없음</div>'}
function renderFilters(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));document.querySelectorAll('.period span').forEach(x=>x.classList.toggle('active',+x.dataset.period===state.days));const cats=['전체',...new Set(allNews.flatMap(i=>arr(i.categories)))];categoryChips.innerHTML=cats.map(c=>`<span class="chip ${c===state.category?'active':''}" data-c="${c}">${c}</span>`).join('');categoryChips.querySelectorAll('span').forEach(x=>x.onclick=()=>{state.category=x.dataset.c;render()});productQuick.innerHTML=['전체',...trackedProducts].map(p=>`<span class="${p===state.product?'active':''}" data-p="${p}">${p}</span>`).join('');productQuick.querySelectorAll('span').forEach(x=>x.onclick=()=>{state.product=x.dataset.p;state.view=p==='전체'?state.view:'competitor';render()})}
function renderMetrics(items){mTotal.textContent=items.length+'건';mOwn.textContent=items.filter(own).length+'건';mComp.textContent=items.filter(comp).length+'건';const c=counts(items,i=>arr(i.categories))[0];mTop.textContent=c?`${c[0]} ${c[1]}건`:'-'}
function renderBrief(items){if(!allNews.length){briefText.textContent='아직 수집된 뉴스가 없습니다. Actions를 최초 실행하면 데이터가 표시됩니다.';return}if(!items.length){briefText.textContent='선택한 조건에 해당하는 뉴스가 없습니다.';return}const topC=counts(items,i=>arr(i.categories))[0];const topComp=counts(items,i=>[...arr(i.competitor_company_mentions),...arr(i.competitor_product_mentions)])[0];briefText.textContent=`총 ${items.length}건. ${topC?`'${topC[0]}' 관련 뉴스가 가장 많고`:''} ${topComp?`경쟁사/제품 중 '${topComp[0]}' 언급이 두드러집니다.`:'경쟁사 언급은 아직 많지 않습니다.'}`}
function renderNews(items){newsList.innerHTML=items.length?items.slice(0,60).map(i=>`<a class="news" href="${i.link}" target="_blank" rel="noopener"><p class="news-title">${own(i)?'<span class="badge">WONTECH</span>':''}${comp(i)?'<span class="badge">경쟁</span>':''}${i.title}</p><div class="meta">${i.source||''} · ${arr(i.categories).join(' · ')} · ${when(i.pub_date)?when(i.pub_date).toLocaleDateString('ko-KR'):''}</div></a>`).join(''):'<div class="empty">해당 조건의 기사가 없습니다.</div>'}
function renderTrends(){const now=Date.now();const w1=allNews.filter(i=>{const d=when(i.pub_date);return d&&d>=new Date(now-7*86400000)}).length;const w2=allNews.filter(i=>{const d=when(i.pub_date);return d&&d<new Date(now-7*86400000)&&d>=new Date(now-14*86400000)}).length;const delta=w2?Math.round((w1-w2)/w2*100):null;momentum.innerHTML=`<div style="font-size:28px;font-weight:700">${w1}건</div><div class="meta">이전 7일 ${w2}건 · ${delta===null?'비교기준 없음':(delta>=0?'+':'')+delta+'%'}</div>`;const base=allNews.filter(i=>inDays(i,30));bars(competitorBars,counts(base,i=>[...arr(i.competitor_company_mentions),...arr(i.competitor_product_mentions)]));bars(categoryBars,counts(base,i=>arr(i.categories)))}
function render(){const items=filtered();renderFilters();renderMetrics(items);renderBrief(items);renderNews(items);renderTrends();const dates=allNews.map(i=>when(i.pub_date)).filter(Boolean);lastUpdated.textContent=dates.length?`최근 수집 기사: ${new Date(Math.max(...dates)).toLocaleString('ko-KR')}`:'아직 수집된 데이터가 없습니다.'}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{state.view=x.dataset.view;state.product='전체';render()});document.querySelectorAll('.period span').forEach(x=>x.onclick=()=>{state.days=+x.dataset.period;render()});
async function load(){try{const r=await fetch(DATA_URL,{cache:'no-store'});allNews=r.ok?await r.json():[]}catch(e){allNews=[]}render();loadEvents()}
let cy,cm;function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`}
async function loadEvents(){try{const r=await fetch(EXH_URL,{cache:'no-store'});events=r.ok?await r.json():[]}catch(e){events=[]}events=events.map(e=>({...e,s:new Date(e.start_date),t:new Date(e.end_date)})).sort((a,b)=>a.s-b.s);const now=new Date();eventList.innerHTML=events.filter(e=>e.t>=new Date(now.toDateString())).slice(0,10).map(e=>`<div class="event-row"><a href="${e.source}" target="_blank">${e.name}</a><span>${fmt(e.s)}~${fmt(e.t)}</span></div>`).join('')||'<div class="empty">등록 행사 없음</div>';cy=now.getFullYear();cm=now.getMonth();drawCal()}
function drawCal(){calTitle.textContent=`${cy}년 ${cm+1}월`;const first=new Date(cy,cm,1),last=new Date(cy,cm+1,0);let h=['일','월','화','수','목','금','토'].map(x=>`<span class="dow">${x}</span>`).join('');for(let i=0;i<first.getDay();i++)h+='<span></span>';for(let d=1;d<=last.getDate();d++){const x=new Date(cy,cm,d);const hit=events.some(e=>x>=new Date(e.s.toDateString())&&x<=new Date(e.t.toDateString()));h+=`<span class="${hit?'evt':''}" data-d="${d}">${d}</span>`}calendar.innerHTML=h;calendar.querySelectorAll('.evt').forEach(x=>x.onclick=()=>{const d=new Date(cy,cm,+x.dataset.d);const es=events.filter(e=>d>=new Date(e.s.toDateString())&&d<=new Date(e.t.toDateString()));calDetail.innerHTML=es.map(e=>`<a href="${e.source}" target="_blank">${e.name}</a> · ${e.location}`).join('<br>')})}
prev.onclick=()=>{cm--;if(cm<0){cm=11;cy--}drawCal()};next.onclick=()=>{cm++;if(cm>11){cm=0;cy++}drawCal()};load();
</script></body></html>
