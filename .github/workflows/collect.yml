name: Medical Aesthetic Device News 수집

on:
  schedule:
    - cron: "30 22 * * 0-4"   # 평일 KST 07:30
  workflow_dispatch:
    inputs:
      send_mode:
        description: "영업 메일 발송 (none=수집만 / test=테스트 수신자 / all=영업부문 전체)"
        type: choice
        options: [none, test, all]
        default: none

permissions:
  contents: write
  models: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 네이버 뉴스 수집
        working-directory: collectors
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python naver_news.py
      - name: 해외 RSS 수집
        working-directory: collectors
        continue-on-error: true
        run: python overseas_rss.py

      - name: MFDS 에스테틱 허가 후보 수집
        working-directory: collectors
        env:
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
        run: python mfds_approvals.py
        
      - name: KIPRIS 특허 트렌드
        working-directory: collectors
        continue-on-error: true
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
        run: python kipris_patents.py
      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "news-clipping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json docs/data/*.json
          git diff --quiet --cached || git commit -m "chore: device news update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: 영업부문 아침 브리핑 메일
        if: github.event_name == 'schedule' || inputs.send_mode == 'test' || inputs.send_mode == 'all'
        continue-on-error: true
        env:
          SEND_MODE: ${{ inputs.send_mode || 'all' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SALES_EMAIL_TO: ${{ secrets.SALES_EMAIL_TO }}
          SALES_EMAIL_TEST_TO: ${{ secrets.SALES_EMAIL_TEST_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python send_sales_brief.py
