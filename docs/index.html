<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WONTECH Medical Aesthetic Device News</title>
<style>
:root{
  --bg:#ffffff;--surface:#f7f7f5;--surface2:#f1f1ee;--text:#171717;--sub:#666;--muted:#9a9a94;
  --border:#e7e7e2;--accent:#fb510d;--accent-soft:#fff0e8;--purple-soft:#f1edff;--purple:#5846a8;
}
:root.dark{
  --bg:#171715;--surface:#232320;--surface2:#2b2b27;--text:#f2f2ee;--sub:#aaa;--muted:#777;
  --border:#383832;--accent-soft:#4a2416;--purple-soft:#302b45;--purple:#c8bdf5;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55}.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px}.header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:14px}.brand{display:flex;gap:18px;align-items:center}.logo{font-weight:800;color:var(--accent);letter-spacing:.2px;font-size:15px}.title h1{font-size:19px;margin:0 0 3px}.muted{font-size:11px;color:var(--sub)}.header-tools{display:flex;align-items:center;gap:8px}.period{display:flex;background:var(--surface);border-radius:8px;padding:3px;gap:2px}.period button,.iconbtn{border:0;background:transparent;color:var(--sub);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}.period button.active{background:var(--bg);color:var(--text);font-weight:700}.iconbtn{border:1px solid var(--border);background:var(--bg);font-size:15px;line-height:1}.seg-tabs{display:flex;gap:8px;margin:12px 0 16px}.seg-tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:var(--sub);cursor:pointer}.seg-tab.active{background:var(--accent);color:#fff;font-weight:700}.top-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}.trend-card{background:var(--surface);border-radius:12px;padding:14px 16px;min-height:118px}.trend-card .label{font-size:11px;color:var(--sub)}.trend-card .big{font-size:23px;font-weight:800;margin-top:18px}.trend-card .sub{font-size:11px;color:var(--sub);margin-top:4px}.spark{height:34px;display:flex;align-items:flex-end;gap:3px;margin-top:9px}.spark i{display:block;width:8%;min-width:4px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.86}.main-layout{display:grid;grid-template-columns:118px minmax(0,1fr) 220px;gap:16px;align-items:start}.side-title{font-size:11px;color:var(--muted);margin-bottom:8px}.cats{position:sticky;top:14px}.cat{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;margin:2px 0;border-radius:8px;color:var(--sub);cursor:pointer;font-size:12px}.cat.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.brief{background:var(--purple-soft);border-radius:11px;padding:14px 16px;margin-bottom:12px}.brief b{color:var(--purple);font-size:12px}.brief p{margin:5px 0 0;font-size:13px}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.metric{background:var(--surface);padding:12px;border-radius:10px;min-height:72px}.metric span{font-size:11px;color:var(--sub)}.metric strong{display:block;font-size:20px;margin-top:4px}.search{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:9px 11px;margin-bottom:8px}.news-list{border-top:1px solid var(--border)}.news{display:block;color:inherit;text-decoration:none;padding:10px 2px;border-bottom:1px solid var(--border)}.news:hover .news-title{color:var(--accent)}.news-title{font-size:13px;margin-bottom:4px}.meta{font-size:10px;color:var(--sub)}.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:99px;font-size:9px;margin-right:5px}.right-card{background:var(--surface);border-radius:11px;padding:12px;margin-bottom:12px}.right-title{font-size:11px;color:var(--sub);margin-bottom:8px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal-head button{border:0;background:transparent;color:var(--sub);cursor:pointer}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal-grid span{font-size:10px;padding:4px 0;border-radius:4px}.dow{color:var(--muted)}.evt{background:var(--accent-soft);color:var(--accent);font-weight:800;cursor:pointer}.cal-detail{font-size:10px;color:var(--sub);margin-top:8px;min-height:16px}.cal-detail a{color:var(--accent)}.event-row{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--border);padding:6px 0;font-size:10px}.event-row a{color:inherit}.comp-list{margin-top:14px}.comp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.comp-head b{font-size:12px}.comp-head span{font-size:10px;color:var(--sub)}.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.comp-row{display:grid;grid-template-columns:8px 1fr auto auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--border);cursor:pointer;font-size:11px}.comp-row:hover{background:var(--surface)}.dot{width:6px;height:6px;background:#ef4444;border-radius:1px}.count{font-weight:800}.share{color:#8c8ca3}.arrow{color:#bbb}.empty{padding:20px;text-align:center;color:var(--muted)}
@media(max-width:900px){.main-layout{grid-template-columns:1fr}.cats{position:static;display:flex;gap:5px;flex-wrap:wrap}.cat{width:auto}.right-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.top-metrics{grid-template-columns:1fr}.comp-grid{grid-template-columns:1fr}}
@media(max-width:640px){.header{flex-direction:column}.brand{align-items:flex-start}.metric-row{grid-template-columns:repeat(2,1fr)}.right-col{grid-template-columns:1fr}.seg-tabs{overflow:auto}.seg-tab{white-space:nowrap}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="brand"><div class="logo">WONTECH</div><div class="title"><h1>Medical Aesthetic Device News</h1><div class="muted" id="lastUpdated">불러오는 중...</div></div></div>
    <div class="header-tools"><div class="period"><button class="active" data-days="1">오늘</button><button data-days="7">주간</button><button data-days="30">월간</button></div><button class="iconbtn" id="themeToggle" title="다크모드">🌙</button></div>
  </header>

  <nav class="seg-tabs"><button class="seg-tab active" data-seg="전체">전체</button><button class="seg-tab" data-seg="에스테틱">에스테틱</button><button class="seg-tab" data-seg="써지컬">써지컬</button></nav>

  <section class="top-metrics">
    <div class="trend-card"><div class="label">RF · HIFU 이슈</div><div class="spark" id="sparkRF"></div><div class="big" id="topRF">-</div><div class="sub" id="subRF">선택 기간 기준</div></div>
    <div class="trend-card"><div class="label">Laser · Pico 이슈</div><div class="spark" id="sparkLaser"></div><div class="big" id="topLaser">-</div><div class="sub" id="subLaser">에스테틱 서브 모니터링</div></div>
    <div class="trend-card"><div class="label">Surgical 이슈</div><div class="spark" id="sparkSurg"></div><div class="big" id="topSurg">-</div><div class="sub" id="subSurg">메디컬솔루션본부 서브 모니터링</div></div>
  </section>

  <section class="comp-list">
    <div class="comp-head"><b>경쟁제품 노출 현황 · 클릭 상세</b><span id="compPeriod">선택 기간 기준</span></div>
    <div class="comp-grid" id="competitorExposure"></div>
  </section>

  <div class="main-layout">
    <aside><div class="side-title">카테고리</div><div class="cats" id="categoryList"></div></aside>

    <main>
      <section class="brief"><b>브리핑 요약</b><p id="briefText">데이터를 불러오는 중입니다...</p></section>
      <section class="metric-row"><div class="metric"><span>수집 뉴스</span><strong id="mTotal">-</strong></div><div class="metric"><span>WONTECH 언급</span><strong id="mOwn">-</strong></div><div class="metric"><span>경쟁사 언급</span><strong id="mComp">-</strong></div><div class="metric"><span>최다 카테고리</span><strong id="mTop">-</strong></div></section>
      <input class="search" id="searchBox" placeholder="뉴스 제목 검색..." />
      <div class="news-list" id="newsList"><div class="empty">불러오는 중...</div></div>
    </main>

    <aside class="right-col">
      <div class="right-card"><div class="cal-head"><button id="prev">‹</button><b id="calTitle"></b><button id="next">›</button></div><div class="cal-grid" id="calendar"></div><div class="cal-detail" id="calDetail">날짜를 클릭하면 학회·전시회 정보를 볼 수 있습니다.</div></div>
      <div class="right-card"><div class="right-title">다가오는 학회 · 전시회</div><div id="eventList"></div></div>
    </aside>
  </div>
</div>
<script>
const DATA_URL='data/news.json', EXH_URL='data/exhibitions.json';
const productAliases={
'슈링크':['슈링크','Shurink','Ultraformer'],'인모드':['인모드','InMode'],'온다':['온다','Onda'],'볼뉴머':['볼뉴머','Volnewmer'],'덴서티':['덴서티','Density'],
'울쎄라':['울쎄라','Ultherapy'],'써마지':['써마지','Thermage'],'티타늄':['티타늄','Titanium'],'세르프':['세르프','XERF'],'리프테라':['리프테라','Liftera'],'소프웨이브':['소프웨이브','Sofwave']
};
const competitorOrder=['슈링크','인모드','온다','볼뉴머','덴서티','울쎄라','써마지','티타늄','세르프','리프테라','소프웨이브'];
let allNews=[],events=[],state={days:1,segment:'전체',category:'전체',product:'전체',q:''};
const A=v=>Array.isArray(v)?v:[]; const D=s=>{const d=new Date(s);return isNaN(d)?null:d};
function own(i){return A(i.own_company_mentions).length+A(i.own_product_mentions).length+A(i.own_brand_mentions).length>0}
function comp(i){return A(i.competitor_company_mentions).length+A(i.competitor_product_mentions).length+A(i.competitor_mentions).length>0}
function segs(i){return A(i.segments).length?A(i.segments):(A(i.categories).includes('Surgical')?['써지컬']:['에스테틱'])}
function inDays(i,n){const d=D(i.pub_date);return !d||d>=new Date(Date.now()-n*86400000)}
function prodHit(i,p){if(p==='전체')return true;const t=[i.title,i.summary,...A(i.competitor_product_mentions),...A(i.competitor_mentions)].join(' ').toLowerCase();return (productAliases[p]||[p]).some(x=>t.includes(x.toLowerCase()))}
function baseFiltered(){return allNews.filter(i=>inDays(i,state.days)&&(state.segment==='전체'||segs(i).includes(state.segment))&&(state.category==='전체'||A(i.categories).includes(state.category))&&prodHit(i,state.product)&&(!state.q||i.title.toLowerCase().includes(state.q.toLowerCase())))}
function countRows(items,fn){const o={};items.forEach(i=>fn(i).forEach(k=>o[k]=(o[k]||0)+1));return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function pct(n,d){return d?Math.round(n/d*100):0}
function renderCats(){const preferred=['전체','RF','HIFU','Laser·Pico','RF Microneedling','Surgical','시장동향','신제품·출시','인허가·규제','학회·임상','글로벌사업','기타'];const present=new Set(allNews.flatMap(i=>A(i.categories)));const list=preferred.filter(x=>x==='전체'||present.has(x));categoryList.innerHTML=list.map(c=>`<button class="cat ${state.category===c?'active':''}" data-c="${c}">${c}</button>`).join('');categoryList.querySelectorAll('.cat').forEach(x=>x.onclick=()=>{state.category=x.dataset.c;state.product='전체';render()})}
function renderTop(items){const rf=items.filter(i=>A(i.categories).some(c=>['RF','HIFU'].includes(c))).length;const laser=items.filter(i=>A(i.categories).includes('Laser·Pico')).length;const surg=items.filter(i=>A(i.categories).includes('Surgical')||segs(i).includes('써지컬')).length;topRF.textContent=rf+'건';topLaser.textContent=laser+'건';topSurg.textContent=surg+'건';[ ['sparkRF',rf],['sparkLaser',laser],['sparkSurg',surg] ].forEach(([id,n])=>{const el=document.getElementById(id);const vals=[3,5,4,7,5,8,6,10].map((x,j)=>Math.max(2,Math.round(x*(n?Math.min(1,n/12):.2))));el.innerHTML=vals.map(v=>`<i style="height:${v*3}px"></i>`).join('')})}
function renderExposure(){const base=allNews.filter(i=>inDays(i,state.days)&&(state.segment==='전체'||segs(i).includes(state.segment)));const counts=competitorOrder.map(p=>[p,base.filter(i=>prodHit(i,p)).length]);const total=counts.reduce((s,x)=>s+x[1],0);competitorExposure.innerHTML=counts.map(([p,n])=>`<div class="comp-row" data-p="${p}"><i class="dot"></i><span>${p}</span><span class="count">${n}개처</span><span class="share">${pct(n,total)}% ›</span></div>`).join('');competitorExposure.querySelectorAll('.comp-row').forEach(x=>x.onclick=()=>{const p=x.dataset.p;state.product=state.product===p?'전체':p;state.category='전체';render()})}
function renderMetrics(items){mTotal.textContent=items.length+'건';mOwn.textContent=items.filter(own).length+'건';mComp.textContent=items.filter(comp).length+'건';const top=countRows(items,i=>A(i.categories))[0];mTop.textContent=top?`${top[0]} ${top[1]}건`:'-'}
function renderBrief(items){if(!items.length){briefText.textContent='선택한 조건에 해당하는 뉴스가 없습니다.';return}const topCat=countRows(items,i=>A(i.categories))[0];const topProd=competitorOrder.map(p=>[p,items.filter(i=>prodHit(i,p)).length]).sort((a,b)=>b[1]-a[1])[0];let s=`이 기간 총 ${items.length}건이 수집되었습니다.`;if(topCat&&topCat[1])s+=` '${topCat[0]}' 관련 이슈가 가장 많았습니다.`;if(topProd&&topProd[1])s+=` 경쟁제품 중 '${topProd[0]}' 노출이 두드러집니다.`;if(state.product!=='전체')s+=` 현재 '${state.product}' 관련 기사만 보고 있습니다.`;briefText.textContent=s}
function renderNews(items){newsList.innerHTML=items.length?items.slice(0,80).map(i=>`<a class="news" href="${i.link}" target="_blank" rel="noopener"><div class="news-title">${own(i)?'<span class="badge">WONTECH</span>':''}${comp(i)?'<span class="badge">경쟁</span>':''}${i.title}</div><div class="meta">${i.source||''} · ${A(i.categories).join(' · ')} · ${D(i.pub_date)?D(i.pub_date).toLocaleDateString('ko-KR'):''}</div></a>`).join(''):'<div class="empty">해당 조건의 기사가 없습니다.</div>'}
function render(){document.querySelectorAll('.seg-tab').forEach(x=>x.classList.toggle('active',x.dataset.seg===state.segment));document.querySelectorAll('.period button').forEach(x=>x.classList.toggle('active',+x.dataset.days===state.days));renderCats();const items=baseFiltered();renderTop(items);renderExposure();renderMetrics(items);renderBrief(items);renderNews(items);const ds=allNews.map(i=>D(i.pub_date)).filter(Boolean);lastUpdated.textContent=ds.length?`최근 수집 기사: ${new Date(Math.max(...ds)).toLocaleString('ko-KR')}`:'아직 수집된 데이터가 없습니다.'}
document.querySelectorAll('.seg-tab').forEach(x=>x.onclick=()=>{state.segment=x.dataset.seg;state.category='전체';state.product='전체';render()});document.querySelectorAll('.period button').forEach(x=>x.onclick=()=>{state.days=+x.dataset.days;render()});searchBox.oninput=e=>{state.q=e.target.value.trim();render()};
function setTheme(dark){document.documentElement.classList.toggle('dark',dark);themeToggle.textContent=dark?'☀️':'🌙';localStorage.setItem('madn-theme',dark?'dark':'light')}themeToggle.onclick=()=>setTheme(!document.documentElement.classList.contains('dark'));setTheme(localStorage.getItem('madn-theme')==='dark');
async function load(){try{const r=await fetch(DATA_URL,{cache:'no-store'});allNews=r.ok?await r.json():[]}catch(e){allNews=[]}render();loadEvents()}
let cy,cm;function fmt(d){return `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`}
async function loadEvents(){try{const r=await fetch(EXH_URL,{cache:'no-store'});events=r.ok?await r.json():[]}catch(e){events=[]}events=events.map(e=>({...e,s:new Date(e.start_date),t:new Date(e.end_date)})).sort((a,b)=>a.s-b.s);const now=new Date();eventList.innerHTML=events.filter(e=>e.t>=new Date(now.toDateString())).slice(0,8).map(e=>`<div class="event-row"><a href="${e.source}" target="_blank">${e.name}</a><span>${fmt(e.s)}–${fmt(e.t)}</span></div>`).join('')||'<div class="empty">등록 행사 없음</div>';cy=now.getFullYear();cm=now.getMonth();drawCal()}
function drawCal(){calTitle.textContent=`${cy}년 ${cm+1}월`;const first=new Date(cy,cm,1),last=new Date(cy,cm+1,0);let h=['일','월','화','수','목','금','토'].map(x=>`<span class="dow">${x}</span>`).join('');for(let i=0;i<first.getDay();i++)h+='<span></span>';for(let d=1;d<=last.getDate();d++){const x=new Date(cy,cm,d);const hit=events.some(e=>x>=new Date(e.s.toDateString())&&x<=new Date(e.t.toDateString()));h+=`<span class="${hit?'evt':''}" data-d="${d}">${d}</span>`}calendar.innerHTML=h;calendar.querySelectorAll('.evt').forEach(x=>x.onclick=()=>{const d=new Date(cy,cm,+x.dataset.d);const es=events.filter(e=>d>=new Date(e.s.toDateString())&&d<=new Date(e.t.toDateString()));calDetail.innerHTML=es.map(e=>`<a href="${e.source}" target="_blank">${e.name}</a><br>${e.location}`).join('<br><br>')})}prev.onclick=()=>{cm--;if(cm<0){cm=11;cy--}drawCal()};next.onclick=()=>{cm++;if(cm>11){cm=0;cy++}drawCal()};load();
</script>
</body>
</html>
