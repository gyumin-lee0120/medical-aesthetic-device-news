sources:
  naver_news:
    enabled: true
    display: 100
    max_pages: 2
    sort: date
  overseas_rss:
    enabled: true
    # Google News RSS 검색 (영문, 최근 7일). query만 바꾸면 수집 대상이 바뀝니다.
    google_news:
      - name: "경쟁사·브랜드"
        query: '(InMode OR Ultherapy OR Thermage OR Sofwave OR Classys OR Jeisys OR Lutronic OR "Cynosure Lutronic" OR "Candela Medical" OR Cutera OR "Solta Medical" OR "Merz Aesthetics" OR Hironic OR Asterasys OR Laseroptek OR SHENB OR "Alma Lasers" OR Fotona OR Lumenis OR "VIOL Co") when:7d'
      - name: "기술 트렌드"
        query: '("radiofrequency microneedling" OR "focused ultrasound" skin OR "picosecond laser" OR "energy-based device" OR "aesthetic laser" OR "skin tightening device") when:7d'
      - name: "시장·규제"
        query: '("medical aesthetics" OR "aesthetic medical device" OR "aesthetic device") (FDA OR market OR launch OR approval) when:7d'
      - name: "원텍"
        query: '(WONTECH OR Oligio OR Lavieen OR PicoCare) when:30d'

  kipris_patents:
    enabled: true   # KIPRIS Plus API 키 발급 후 true
    keywords: ["고주파 리프팅","집속초음파","피코 레이저","의료용 레이저","수술용 레이저"]
  exhibitions:
    enabled: true


